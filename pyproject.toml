[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-redis-iplweb"
dynamic = ["version"]
description = "Full featured redis cache backend for Django."
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Antoukh", email = "niwi@niwi.nz" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "Django>=5.2,<6.1",
    "redis>=4.0.2",
]

[project.optional-dependencies]
hiredis = ["redis[hiredis]>=4.0.2"]

[project.urls]
Homepage = "https://github.com/jazzband/django-redis"

[tool.setuptools.dynamic]
version = { attr = "django_redis.__version__" }

[tool.setuptools]
packages = [
    "django_redis",
    "django_redis.client",
    "django_redis.client.mixins",
    "django_redis.serializers",
    "django_redis.compressors",
]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.rst"
issue_format = "`#{issue} <https://github.com/jazzband/django-redis/issues/{issue}>`_"
name = "django-redis-iplweb"
package = "django_redis"
type = [
  { name = "Features",                  directory = "feature", showcontent = true },
  { name = "Bug Fixes",                 directory = "bugfix",  showcontent = true },
  { name = "Miscellaneous",             directory = "misc",    showcontent = true },
  { name = "Documentation",             directory = "doc",     showcontent = true },
  { name = "Deprecations and Removals", directory = "removal", showcontent = true },
]

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=django_redis --cov-config=pyproject.toml --no-cov-on-fail"
pythonpath = ["tests"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
precision = 1
skip_covered = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
show_error_context = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.django-stubs]
django_settings_module = "tests.settings.sqlite"
ignore_missing_settings = true

[[tool.mypy.overrides]]
module = ["lz4.frame", "xdist.scheduler", "pyzstd", "msgpack", "redis.sentinel"]
ignore_missing_imports = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 3.15.0
envlist =
    ruff
    mypy
    # tests against released versions
    py{311,312,313,314}-dj52-redislatest
    py{312,313,314}-dj60-redislatest
    # tests against unreleased versions
    py314-dj60-redismaster
    py314-djmain-redis{latest,master}

[gh-actions]
python =
    3.11: py311, ruff, mypy
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: dj52
    6.0: dj60
    main: djmain
REDIS =
    latest: redislatest
    master: redismaster

[testenv]
passenv = CI, GITHUB*
commands =
  {envpython} -m pytest -n 4 {posargs}

deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    djmain: https://github.com/django/django/archive/main.tar.gz
    msgpack>=0.6.0
    pytest
    pytest-cov
    pytest-mock
    pytest-pythonpath
    pytest-xdist
    redismaster: https://github.com/redis/redis-py/archive/master.tar.gz
    lz4>=0.15
    pyzstd>=0.15

[testenv:{pre-commit,mypy}]
basepython = python3
envdir={toxworkdir}/lint
commands =
    pre-commit: pre-commit run --all-files
    mypy: mypy {posargs:--cobertura-xml-report .} django_redis tests
deps =
    django-stubs
    lxml
    pre-commit
    mypy
    # typing dependencies
    pytest
    pytest-mock
    types-redis
skip_install = true
"""
